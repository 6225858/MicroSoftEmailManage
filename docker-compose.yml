# MicroSoftEmailManage Docker 部署
# 升级提示：修改代码后务必执行 `docker compose up -d --build` 重新构建镜像，
# 否则仍会运行旧镜像（如 1.0.0 版本）。新版会在启动时把旧版本写在 /app/mail.db
# 的数据库自动迁移到挂载卷 /app/data/mail.db，避免邮箱数据被清空。
# 邮箱数据通过 ./data 卷持久化，请勿删除该目录或卷。
services:
  mail-manager:
    image: ms-email-manager:latest
    build: .
    container_name: ms-email-manager
    ports:
      - "10019:10019"
    environment:
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
    volumes:
      # 持久化数据库文件（重要！防止容器删除后数据丢失）
      - ./data:/app/data
      # 持久化导出的邮件报告HTML
      - ./html:/app/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10019/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s